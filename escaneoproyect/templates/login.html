<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <!-- 
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=1.0">
  -->
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}?v=1.0"> 
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, msg in messages %}
            <div class="message {{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <input name="username" placeholder="Usuario" required autofocus>
      <input name="password" placeholder="Contraseña" type="password" required>
      <button type="submit">Entrar</button>
    </form>

    <div class="register-link">
      <p>¿No tienes cuenta?</p>
      <a href="{{ url_for('register') }}">Registrarme</a>
    </div>

    <div class="admin-info">
      <p>¿Eres admin? Usa el usuario <strong>admin</strong> y la contraseña del archivo <code>admin_pass.txt</code></p>
    </div>
  </div>
</body>
</html>
