{% extends "home.html" %}
{% block content %}

<h2 class="title">Gestión de Facturas</h2>

<!-- FORMULARIO PARA SUBIR FACTURA -->
<form action="{{ url_for('facturas.facturas_upload') }}"
      method="POST"
      enctype="multipart/form-data"
      class="upload-box">

    <label for="file">Subir factura (.xls o .xlsx):</label>
    <input type="file" name="file" required>
    <button type="submit" class="btn">Subir</button>
</form>

<hr>

<table class="tabla-facturas">
    <thead>
        <tr>
            <th>Archivo</th>
            <th>Ruta</th>
            <th>Descargar JSON</th>
            <th>Borrar</th>
        </tr>
    </thead>

    <tbody>
        {% for f in facturas %}
        <tr>

            <!-- NOMBRE DEL ARCHIVO -->
            <td>{{ f.filename }}</td>

            <!-- RUTA DONDE SE GUARDÓ -->
            <td>{{ f.path }}</td>

            <!-- DESCARGAR JSON (AÚN NO IMPLEMENTADO) -->
            <td>
                <a class="btn btn-sm"
                   href="#">
                    Descargar JSON
                </a>
            </td>

            <!-- ELIMINAR FACTURA (AÚN NO IMPLEMENTADO) -->
            <td>
                <form method="POST" action="#">
                    <button class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Eliminar factura?');">
                        Eliminar
                    </button>
                </form>
            </td>

        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
