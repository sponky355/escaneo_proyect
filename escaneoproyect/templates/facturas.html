{% extends "home.html" %}
{% block content %}

<h2 class="title">Gestión de Facturas</h2>

<!-- FORMULARIO SUBIR FACTURA -->
<form action="{{ url_for('facturas.facturas_upload') }}"
      method="POST"
      enctype="multipart/form-data"
      class="upload-box">

    <label>Subir factura (.xls o .xlsx)</label>
    <input type="file" name="file" accept=".xls,.xlsx" required>
    <button class="btn">Subir</button>
</form>

<hr>

<table class="tabla-facturas">
    <thead>
        <tr>
            <th>Archivo</th>
            <th>Fecha</th>
            <th>Registros</th>
            <th>Descargar JSON</th>
            <th>Borrar</th>
        </tr>
    </thead>
    <tbody>
        {% for f in facturas %}
        <tr>
            <td>{{ f.nombre_archivo }}</td>
            <td>{{ f.fecha_subida }}</td>
            <td>{{ f.total_registros }} registros</td>
            <td>
                <a class="btn btn-sm"
                   href="{{ url_for('facturas.facturas_download', id_mongo=f._id|string) }}">
                    📥 Descargar JSON
                </a>
            </td>
            <td>
                <form action="{{ url_for('facturas.facturas_delete', id_mongo=f._id|string) }}"
                      method="POST">
                    <button class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Eliminar factura?');">
                        🗑️ Eliminar
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
